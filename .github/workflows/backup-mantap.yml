name: Backup VPS ke HuggingFace Bucket

on:
  workflow_dispatch:   # tombol klik manual

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Tarik data dari VPS
        run: |
          mkdir -p ./mantap
          sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/mantap/ ./mantap/

      - name: Install HuggingFace CLI
        run: pip install -U huggingface_hub

      - name: Sync ke HuggingFace Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf buckets sync ./mantap hf://buckets/pelayanansejahtera/wan25/mantap
