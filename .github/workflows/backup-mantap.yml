name: Backup VPS ke HuggingFace Bucket

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config (SFTP ke VPS)
        run: |
          OBSCURED_PASS=$(rclone obscure "${{ secrets.VPS_PASSWORD }}")
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [vps]
          type = sftp
          host = ${{ secrets.VPS_HOST }}
          user = ${{ secrets.VPS_USER }}
          pass = $OBSCURED_PASS
          port = 22
          EOF

      - name: Tarik data dari VPS (paralel)
        run: |
          echo "📥 Downloading..."
          
          rclone copy vps:/var/www/html/mantap ./mantap \
            --transfers 4 --checkers 4 \
            --sftp-set-modtime=false \
            --contimeout 30s --timeout 300s \
            --retries 5 --low-level-retries 20 \
            -q &
          RCLONE_PID=$!

          while kill -0 $RCLONE_PID 2>/dev/null; do
            SIZE=$(du -sh ./mantap 2>/dev/null | cut -f1)
            COUNT=$(find ./mantap -type f 2>/dev/null | wc -l)
            echo "⏳ Progress: ${COUNT} files, ${SIZE:-0}"
            sleep 15
          done

          wait $RCLONE_PID
          echo "✅ Download selesai"

      - name: Install HuggingFace CLI
        run: pip install -U huggingface_hub

      - name: Sync ke HuggingFace Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf buckets sync ./mantap hf://buckets/pelayanansejahtera/wan25/mantap
